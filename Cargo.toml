[package]
name = "typed-css"
version = "0.2.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/typed-css"
homepage = "https://github.com/lpotthast/typed-css"
documentation = "https://docs.rs/typed-css"
description = "Typed, grammar-checked CSS values and declarations"
categories = ["web-programming", "gui", "wasm"]
keywords = ["css", "typed", "style", "declarations", "leptos"]
exclude = [
    "/.codegraph/**",
    "/.cargo/**",
    "/.github/**",
    "/.idea/**",
    "/AGENTS.md",
    "/Justfile",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = []
# Lets a `Declaration` render directly as a Leptos style attribute.
leptos = ["dep:leptos"]

[dependencies]
leptos = { version = "0.8.22", default-features = false, optional = true }

[dev-dependencies]
assertr = { version = "0.9.1" }

[[test]]
name = "direct_leptos"
path = "tests/direct_leptos.rs"
required-features = ["leptos"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
